<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeZella Lite - 交易日誌</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#10b981', 600: '#059669' } } } }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- TradingView Lightweight Charts (確保正確載入) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500/10 p-2 rounded-xl border border-emerald-500/20 text-emerald-400">
          <i data-lucide="line-chart" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white flex items-center gap-2">
            TradeZella <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Web Edition</span>
          </h1>
          <p class="text-xs text-slate-400">交易紀錄與 TradingView K 線繪製分析</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="exportData()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> 匯出 JSON
        </button>
        <label class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 cursor-pointer transition">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i> 匯入 JSON
          <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
        </label>
        <button onclick="resetDemoData()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg border border-rose-500/20 transition">
          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 重置數據
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Dashboard Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">總淨損益 (Net PnL)</span>
        <div id="statNetPnL" class="text-2xl font-bold mt-1 text-emerald-400">$0.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">勝率 (Win Rate)</span>
        <div id="statWinRate" class="text-2xl font-bold mt-1 text-sky-400">0%</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">獲利因子 (Profit Factor)</span>
        <div id="statProfitFactor" class="text-2xl font-bold mt-1 text-amber-400">0.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">平均風報比 (Avg R-Mult)</span>
        <div id="statAvgR" class="text-2xl font-bold mt-1 text-purple-400">0.00R</div>
      </div>
    </div>

    <!-- Chart Visualizer -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="candlestick-chart" class="w-5 h-5 text-emerald-400"></i>
          <h2 class="font-semibold text-slate-200">TradingView K 線進出場標記區</h2>
        </div>
        <div id="activeTradeInfo" class="text-xs text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 font-mono">
          載入中...
        </div>
      </div>
      <div class="p-4">
        <div id="chartContainer" class="w-full h-[400px] bg-slate-950 rounded-lg border border-slate-800/80"></div>
      </div>
    </div>

    <!-- Form + Table -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left: Form -->
      <div class="lg:col-span-4 bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <h2 class="font-semibold border-b border-slate-800 pb-3 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> 新增交易筆數
        </h2>
        <form id="tradeForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">標的</label>
              <input type="text" id="symbol" placeholder="TSLA" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm uppercase">
            </div>
            <div>
              <label class="text-xs text-slate-400">方向</label>
              <select id="side" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">日期</label>
              <input type="date" id="date" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-400">股數</label>
              <input type="number" id="qty" placeholder="100" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">買價 (Entry)</label>
              <input type="number" step="any" id="entryPrice" placeholder="200" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-400">賣價 (Exit)</label>
              <input type="number" step="any" id="exitPrice" placeholder="215" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">停損價 (SL)</label>
              <input type="number" step="any" id="stopLoss" placeholder="195" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-400">目標價 (TP)</label>
              <input type="number" step="any" id="targetPrice" placeholder="220" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-400">標籤</label>
            <select id="tag" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
              <option value="Breakout">Breakout</option>
              <option value="Pullback">Pullback</option>
              <option value="Reversal">Reversal</option>
              <option value="FOMO">FOMO</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400">檢討筆記</label>
            <textarea id="notes" rows="2" placeholder="進場原因檢討..." class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm"></textarea>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded text-sm font-medium">儲存紀錄</button>
        </form>
      </div>

      <!-- Right: Log -->
      <div class="lg:col-span-8 bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <h2 class="font-semibold border-b border-slate-800 pb-3 flex items-center gap-2">
          <i data-lucide="book-open" class="w-4 h-4 text-emerald-400"></i> 交易歷史明細
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="text-xs text-slate-400 border-b border-slate-800">
              <tr>
                <th class="py-2">日期</th>
                <th class="py-2">標的</th>
                <th class="py-2">方向</th>
                <th class="py-2">價位</th>
                <th class="py-2">損益</th>
                <th class="py-2">標籤</th>
                <th class="py-2 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="journalTableBody" class="divide-y divide-slate-800/60 font-mono text-xs"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    const DEMO_TRADES = [
      { id: "t1", symbol: "TSLA", side: "LONG", date: "2026-10-20", qty: 100, entryPrice: 210, exitPrice: 232.5, stopLoss: 202, targetPrice: 235, tag: "Breakout", notes: "量能突破進場" },
      { id: "t2", symbol: "NVDA", side: "SHORT", date: "2026-10-22", qty: 50, entryPrice: 142, exitPrice: 147.2, stopLoss: 145, targetPrice: 132, tag: "FOMO", notes: "衝動追空" }
    ];

    let trades = [];
    let chart = null;
    let candlestickSeries = null;
    let selectedTradeId = null;

    window.onload = function() {
      lucide.createIcons();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      
      setTimeout(() => {
        initChart();
        loadTrades();
      }, 200);
    };

    function initChart() {
      const container = document.getElementById('chartContainer');
      if (!container || typeof LightweightCharts === 'undefined') {
        console.error('LightweightCharts CDN 未成功載入');
        return;
      }
      container.innerHTML = '';

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 400,
        layout: { background: { type: 'solid', color: '#020617' }, textColor: '#94a3b8' },
        grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
        timeScale: { borderColor: '#334155' }
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#10b981', downColor: '#f43f5e',
        borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#f43f5e'
      });
    }

    function updateChartForTrade(trade) {
      if (!chart || !candlestickSeries) return;

      document.getElementById('activeTradeInfo').innerHTML = 
        `<b class="text-emerald-400">${trade.symbol}</b> | ${trade.side} @ $${trade.entryPrice} → $${trade.exitPrice}`;

      const candles = generateKLines(trade);
      candlestickSeries.setData(candles);

      candlestickSeries.setMarkers([
        { time: trade.date, position: trade.side === 'LONG' ? 'belowBar' : 'aboveBar', color: trade.side === 'LONG' ? '#10b981' : '#f43f5e', shape: trade.side === 'LONG' ? 'arrowUp' : 'arrowDown', text: `買入: $${trade.entryPrice}` },
        { time: getNextDay(trade.date), position: 'aboveBar', color: '#38bdf8', shape: 'circle', text: `賣出: $${trade.exitPrice}` }
      ]);

      chart.timeScale().fitContent();
    }

    function generateKLines(trade) {
      const result = [];
      const base = new Date(trade.date);
      let price = trade.entryPrice;

      for (let i = -10; i <= 10; i++) {
        const d = new Date(base);
        d.setDate(d.getDate() + i);
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        const dStr = d.toISOString().split('T')[0];

        let open = price;
        let change = (Math.random() - 0.48) * (open * 0.02);
        if (dStr === trade.date) { open = trade.entryPrice * 0.99; change = trade.exitPrice - trade.entryPrice; }
        
        const close = open + change;
        const high = Math.max(open, close) + 1;
        const low = Math.min(open, close) - 1;

        result.push({ time: dStr, open, high, low, close });
        price = close;
      }
      return result;
    }

    function getNextDay(dateStr) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function loadTrades() {
      const saved = localStorage.getItem('tradezella_trades');
      trades = saved ? JSON.parse(saved) : DEMO_TRADES;
      calculateStats();
      renderTable();
      if (trades.length > 0) selectTrade(trades[0].id);
    }

    function saveTrades() {
      localStorage.setItem('tradezella_trades', JSON.stringify(trades));
      calculateStats();
      renderTable();
    }

    function calculateStats() {
      if (trades.length === 0) return;
      let netPnL = 0, wins = 0;
      trades.forEach(t => {
        const mult = t.side === 'LONG' ? 1 : -1;
        const pnl = (t.exitPrice - t.entryPrice) * t.qty * mult;
        netPnL += pnl;
        if (pnl > 0) wins++;
      });

      document.getElementById('statNetPnL').innerText = `$${netPnL.toFixed(2)}`;
      document.getElementById('statWinRate').innerText = `${((wins / trades.length) * 100).toFixed(1)}%`;
    }

    function renderTable() {
      const tbody = document.getElementById('journalTableBody');
      tbody.innerHTML = '';

      trades.forEach(t => {
        const mult = t.side === 'LONG' ? 1 : -1;
        const pnl = (t.exitPrice - t.entryPrice) * t.qty * mult;
        const isSel = t.id === selectedTradeId;

        const tr = document.createElement('tr');
        tr.className = `cursor-pointer ${isSel ? 'bg-emerald-500/10' : 'hover:bg-slate-800/40'}`;
        tr.onclick = () => selectTrade(t.id);

        tr.innerHTML = `
          <td class="py-2 px-1 text-slate-400">${t.date}</td>
          <td class="font-bold text-slate-200">${t.symbol}</td>
          <td><span class="px-1 py-0.5 rounded text-[10px] ${t.side === 'LONG' ? 'bg-emerald-950 text-emerald-400' : 'bg-rose-950 text-rose-400'}">${t.side}</span></td>
          <td class="text-slate-300">$${t.entryPrice}→$${t.exitPrice}</td>
          <td class="font-bold ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
          <td><span class="bg-slate-800 px-1 py-0.5 rounded text-[10px]">${t.tag}</span></td>
          <td class="text-right"><button onclick="deleteTrade('${t.id}')" class="text-rose-500">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function selectTrade(id) {
      selectedTradeId = id;
      const t = trades.find(item => item.id === id);
      if (t) updateChartForTrade(t);
      renderTable();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newT = {
        id: "t" + Date.now(),
        symbol: document.getElementById('symbol').value.toUpperCase(),
        side: document.getElementById('side').value,
        date: document.getElementById('date').value,
        qty: parseFloat(document.getElementById('qty').value),
        entryPrice: parseFloat(document.getElementById('entryPrice').value),
        exitPrice: parseFloat(document.getElementById('exitPrice').value),
        stopLoss: parseFloat(document.getElementById('stopLoss').value) || null,
        targetPrice: parseFloat(document.getElementById('targetPrice').value) || null,
        tag: document.getElementById('tag').value,
        notes: document.getElementById('notes').value
      };
      trades.unshift(newT);
      saveTrades();
      selectTrade(newT.id);
    }

    function deleteTrade(id) {
      trades = trades.filter(t => t.id !== id);
      saveTrades();
      if (trades.length > 0) selectTrade(trades[0].id);
    }

    function resetDemoData() {
      trades = DEMO_TRADES;
      saveTrades();
      if (trades.length > 0) selectTrade(trades[0].id);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trades, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `trades_backup.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(evt) {
        trades = JSON.parse(evt.target.result);
        saveTrades();
        if (trades.length > 0) selectTrade(trades[0].id);
      };
      r.readAsText(file);
    }
  </script>
</body>
</html>
