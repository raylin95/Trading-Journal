<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raylin's Trading Journal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#10b981', 600: '#059669' } } } }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500/10 p-2 rounded-xl border border-emerald-500/20 text-emerald-400">
          <i data-lucide="image" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white flex items-center gap-2">
            Raylin's Trading Journal 
          </h1>
          <p class="text-xs text-slate-400">Daily Review</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="exportData()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Output JSON
        </button>
        <label class="flex items-center gap-1.5 px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 cursor-pointer transition">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Input JSON
          <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
        </label>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- Dashboard Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">Net PnL</span>
        <div id="statNetPnL" class="text-2xl font-bold mt-1 text-emerald-400">$0.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">Win Rate</span>
        <div id="statWinRate" class="text-2xl font-bold mt-1 text-sky-400">0%</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">Profit Factor</span>
        <div id="statProfitFactor" class="text-2xl font-bold mt-1 text-amber-400">0.00</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <span class="text-xs text-slate-400">Total Trades</span>
        <div id="statTotalTrades" class="text-2xl font-bold mt-1 text-purple-400">0</div>
      </div>
    </div>

    <!-- 交易圖檔展示區 (Image Display Area) -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="px-5 py-3 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="eye" class="w-5 h-5 text-emerald-400"></i>
          <h2 class="font-semibold text-slate-200">Chart review</h2>
        </div>
        <div id="activeTradeInfo" class="text-xs text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 font-mono">
          no chose any trades
        </div>
      </div>
      <div class="p-4 flex flex-col items-center justify-center min-h-[350px] bg-slate-950 relative">
        <img id="tradeImagePreview" src="" alt="交易圖片" class="max-h-[500px] w-auto object-contain rounded-lg border border-slate-800 hidden">
        <div id="noImagePlaceholder" class="text-center text-slate-500 p-8 space-y-2">
          <i data-lucide="image-off" class="w-12 h-12 mx-auto stroke-1"></i>
          <p class="text-sm">Add photos</p>
        </div>
      </div>
    </div>

    <!-- Form + Table -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Left: Form -->
      <div class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <h2 class="font-semibold border-b border-slate-800 pb-3 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> Add Futures Trade
        </h2>
        <form id="tradeForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400"></label>
              <select id="symbol" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm text-emerald-400 font-bold">
                 <label class="text-xs text-slate-400">Commodity</label>
                <option value="MES">MES</option>
                <option value="MNQ">MNQ</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-slate-400">Direction</label>
              <select id="side" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">Date</label>
              <input type="date" id="date" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
            <div>
              <label class="text-xs text-slate-400">Contracts</label>
              <input type="number" id="qty" placeholder="1" min="1" value="1" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
            </div>
          </div>

          <!-- K 線進出場棒數 (1-81) -->
          <div class="grid grid-cols-2 gap-2 bg-slate-950/60 p-2 rounded-lg border border-slate-800">
            <div>
              <label class="text-xs text-sky-400 font-medium">Entry Time (1-81)</label>
              <input type="number" id="entryBar" min="1" max="81" placeholder=required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm font-mono">
            </div>
            <div>
              <label class="text-xs text-amber-400 font-medium">Exit Time (1-81)</label>
              <input type="number" id="exitBar" min="1" max="81" placeholder= required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm font-mono">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">Entry</label>
              <input type="number" step="any" id="entryPrice" placeholder= required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm font-mono">
            </div>
            <div>
              <label class="text-xs text-slate-400">Exit</label>
              <input type="number" step="any" id="exitPrice" placeholder= required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm font-mono">
            </div>
          </div>

          <!-- 圖片上傳區塊 -->
          <div>
            <label class="text-xs text-slate-400">upload charts</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-slate-200 hover:file:bg-slate-700 cursor-pointer border border-slate-800 rounded-lg p-1 bg-slate-950 mt-1">
          </div>

          <div>
            <label class="text-xs text-slate-400">Strategy</label>
            <select id="tag" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm">
              <option value="Breakout">Breakout</option>
              <option value="Pullback">Pullback</option>
              <option value="Reversal">Reversal</option>
              <option value="Revenge">Trading Range fade</option>
              <option value="Revenge">Trend</option>
              <option value="FOMO">FOMO</option>
              <option value="Revenge">Revenge</optio>
            </select>
          </div>

          <div>
            <label class="text-xs text-slate-400">Note</label>
            <textarea id="notes" rows="2" placeholder="" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-sm"></textarea>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded text-sm font-medium transition flex items-center justify-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i> Save
          </button>
        </form>
      </div>

      <!-- Right: Log -->
      <div class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-4">
        <h2 class="font-semibold border-b border-slate-800 pb-3 flex items-center gap-2">
          <i data-lucide="book-open" class="w-4 h-4 text-emerald-400"></i> Trading Review
        </h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="text-xs text-slate-400 border-b border-slate-800">
              <tr>
                <th class="py-2">Date</th>
                <th class="py-2">Commodity</th>
                <th class="py-2">Direction</th>
                <th class="py-2">Chart scale</th>
                <th class="py-2">PnL</th>
                <th class="py-2">Photo</th>
                <th class="py-2 text-right">Excute</th>
              </tr>
            </thead>
            <tbody id="journalTableBody" class="divide-y divide-slate-800/60 font-mono text-xs"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    const MULTIPLIERS = { MES: 5, MNQ: 2 };

    let trades = [];
    let selectedTradeId = null;

    window.onload = function() {
      lucide.createIcons();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      loadTrades();
    };

    function calculatePnL(trade) {
      const mult = MULTIPLIERS[trade.symbol] || 1;
      const dir = trade.side === 'LONG' ? 1 : -1;
      return (trade.exitPrice - trade.entryPrice) * trade.qty * mult * dir;
    }

    function loadTrades() {
      const saved = localStorage.getItem('tradezella_screenshot_trades');
      trades = saved ? JSON.parse(saved) : [];
      calculateStats();
      renderTable();
      if (trades.length > 0) {
        selectTrade(trades[0].id);
      } else {
        showNoImage();
      }
    }

    function saveTrades() {
      try {
        localStorage.setItem('tradezella_screenshot_trades', JSON.stringify(trades));
      } catch (e) {
        alert("Too large pls ZIP");
      }
      calculateStats();
      renderTable();
    }

    function calculateStats() {
      if (trades.length === 0) {
        document.getElementById('statNetPnL').innerText = '$0.00';
        document.getElementById('statWinRate').innerText = '0%';
        document.getElementById('statProfitFactor').innerText = '0.00';
        document.getElementById('statTotalTrades').innerText = '0';
        return;
      }

      let netPnL = 0, wins = 0, grossWin = 0, grossLoss = 0;
      trades.forEach(t => {
        const pnl = calculatePnL(t);
        netPnL += pnl;
        if (pnl > 0) { wins++; grossWin += pnl; }
        else if (pnl < 0) { grossLoss += Math.abs(pnl); }
      });

      const winRate = ((wins / trades.length) * 100).toFixed(1);
      const pf = grossLoss === 0 ? grossWin.toFixed(2) : (grossWin / grossLoss).toFixed(2);

      const pnlElem = document.getElementById('statNetPnL');
      pnlElem.innerText = `${netPnL >= 0 ? '+' : ''}$${netPnL.toFixed(2)}`;
      pnlElem.className = `text-2xl font-bold mt-1 ${netPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;
      document.getElementById('statWinRate').innerText = `${winRate}%`;
      document.getElementById('statProfitFactor').innerText = pf;
      document.getElementById('statTotalTrades').innerText = trades.length;
    }

    function renderTable() {
      const tbody = document.getElementById('journalTableBody');
      tbody.innerHTML = '';

      trades.forEach(t => {
        const pnl = calculatePnL(t);
        const isSel = t.id === selectedTradeId;

        const tr = document.createElement('tr');
        tr.className = `cursor-pointer ${isSel ? 'bg-emerald-500/10 border-l-2 border-emerald-500' : 'hover:bg-slate-800/40'}`;
        tr.onclick = () => selectTrade(t.id);

        tr.innerHTML = `
          <td class="py-2.5 px-2 text-slate-400">${t.date}</td>
          <td class="font-bold ${t.symbol === 'MES' ? 'text-emerald-400' : 'text-amber-400'}">${t.symbol} (${t.qty}口)</td>
          <td><span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${t.side === 'LONG' ? 'bg-emerald-950 text-emerald-400' : 'bg-rose-950 text-rose-400'}">${t.side}</span></td>
          <td class="text-slate-300 font-mono">Bar ${t.entryBar} → ${t.exitBar}</td>
          <td class="font-bold font-mono ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
          <td>${t.image ? '<span class="text-emerald-400 text-xs">Pic</span>' : '<span class="text-slate-600 text-xs">No Pic</span>'}</td>
          <td class="text-right"><button onclick="event.stopPropagation(); deleteTrade('${t.id}')" class="text-rose-500 hover:text-rose-400">Delet</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function selectTrade(id) {
      selectedTradeId = id;
      const t = trades.find(item => item.id === id);
      if (t) {
        const pnl = calculatePnL(t);
        document.getElementById('activeTradeInfo').innerHTML = 
          `<b class="text-emerald-400">${t.symbol} (${t.qty}口)</b> | ${t.side} Bar ${t.entryBar} ($${t.entryPrice}) → Bar ${t.exitBar} ($${t.exitPrice}) | PnL: <b class="${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</b>`;

        const imgElem = document.getElementById('tradeImagePreview');
        const placeholder = document.getElementById('noImagePlaceholder');

        if (t.image) {
          imgElem.src = t.image;
          imgElem.classList.remove('hidden');
          placeholder.classList.add('hidden');
        } else {
          showNoImage();
        }
      }
      renderTable();
    }

    function showNoImage() {
      document.getElementById('tradeImagePreview').classList.add('hidden');
      document.getElementById('noImagePlaceholder').classList.remove('hidden');
      document.getElementById('activeTradeInfo').innerText = "Not chose or no Pic";
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      
      const fileInput = document.getElementById('imageInput');
      let imageBase64 = null;

      if (fileInput.files && fileInput.files[0]) {
        imageBase64 = await convertFileToBase64(fileInput.files[0]);
      }

      const newT = {
        id: "t" + Date.now(),
        symbol: document.getElementById('symbol').value,
        side: document.getElementById('side').value,
        date: document.getElementById('date').value,
        qty: parseInt(document.getElementById('qty').value),
        entryBar: parseInt(document.getElementById('entryBar').value),
        exitBar: parseInt(document.getElementById('exitBar').value),
        entryPrice: parseFloat(document.getElementById('entryPrice').value),
        exitPrice: parseFloat(document.getElementById('exitPrice').value),
        image: imageBase64,
        tag: document.getElementById('tag').value,
        notes: document.getElementById('notes').value
      };

      trades.unshift(newT);
      saveTrades();
      selectTrade(newT.id);

      // Reset form fields
      document.getElementById('entryPrice').value = '';
      document.getElementById('exitPrice').value = '';
      document.getElementById('entryBar').value = '';
      document.getElementById('exitBar').value = '';
      document.getElementById('notes').value = '';
      document.getElementById('imageInput').value = '';
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function deleteTrade(id) {
      trades = trades.filter(t => t.id !== id);
      saveTrades();
      if (trades.length > 0) {
        selectTrade(trades[0].id);
      } else {
        showNoImage();
      }
    }

    function resetDemoData() {
      trades = [];
      saveTrades();
      showNoImage();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trades, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `futures_screenshot_trades_backup.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = function(evt) {
        trades = JSON.parse(evt.target.result);
        saveTrades();
        if (trades.length > 0) selectTrade(trades[0].id);
      };
      r.readAsText(file);
    }
  </script>
</body>
</html>
